<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collect Payment | MandalFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>💰 Collect Payment</h3>
        </div>

        <div class="card-body">

            <h4>{{ member.name }}</h4>

            <p class="text-muted">
                Mobile: {{ member.mobile }}
            </p>

            <p>
                <strong>Expected Contribution:</strong>
                ₹{{ member.expected_amount }}
            </p>

            <hr>

            <form action="/save-payment" method="POST">

                <!-- Hidden Member ID -->
                <input
                    type="hidden"
                    name="member_id"
                    value="{{ member.id }}">

                <!-- Contribution Type -->
                <div class="mb-3">

                    <label class="form-label">
                        Contribution Type
                    </label>

                    <select
                        class="form-select"
                        name="contribution_type">

                        <option value="Chanda">Chanda</option>
                        <option value="Laddu">Laddu</option>
                        <option value="Sponsor">Sponsor</option>
                        <option value="Donation">Donation</option>
                        <option value="Other">Other</option>

                    </select>

                </div>

                <!-- Amount -->

                <div class="mb-3">

                    <label class="form-label">
                        Amount
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="amount"
                        value="{{ member.expected_amount }}"
                        required>

                </div>

                <!-- Payment Mode -->

                <div class="mb-3">

                    <label class="form-label">
                        Payment Mode
                    </label>

                    <select
                        class="form-select"
                        name="payment_mode">

                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank">Bank Transfer</option>

                    </select>

                </div>

                <!-- Payment Date -->

                <div class="mb-3">

                    <label class="form-label">
                        Payment Date
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        name="payment_date">

                </div>

                <!-- Next Payment Date -->

                <div class="mb-3">

                    <label class="form-label">
                        Next Payment Date (Optional)
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        name="next_payment_date">

                </div>

                <!-- Remarks -->

                <div class="mb-3">

                    <label class="form-label">
                        Remarks
                    </label>

                    <textarea
                        class="form-control"
                        rows="3"
                        name="remarks"></textarea>

                </div>

                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        💰 Save Payment

                    </button>

                    <a
                        href="/member/{{ member.id }}"
                        class="btn btn-secondary">

                        ← Back

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
