<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2>Add Member</h2>

    <form action="/save-member" method="POST">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input
                type="text"
                class="form-control"
                name="name"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mobile</label>
            <input
                type="text"
                class="form-control"
                name="mobile"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">House No</label>
            <input
                type="text"
                class="form-control"
                name="house_no">
        </div>

        <div class="mb-3">
            <label class="form-label">Area</label>
            <input
                type="text"
                class="form-control"
                name="area">
        </div>

        <div class="mb-3">
            <label class="form-label">Expected Amount</label>
            <input
                type="number"
                class="form-control"
                name="expected_amount"
                value="500">
        </div>

        <button type="submit" class="btn btn-success w-100">
            Save Member
        </button>

    </form>

</div>

</body>

</html>
