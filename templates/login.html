<!DOCTYPE html>
<html>

<head>
    <title>MandalFlow Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">
🙏 MandalFlow Login
</h2>

<form method="post" action="/login">

<div class="mb-3">
<label>Username</label>
<input
type="text"
name="username"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Password</label>
<input
type="password"
name="password"
class="form-control"
required>
</div>

<button class="btn btn-primary w-100">
Login
</button>

{% if error %}
<p class="text-danger mt-3 text-center">
{{ error }}
</p>
{% endif %}

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
