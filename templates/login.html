<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | MandalFlow</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="/static/css/login.css">

</head>

<body>

<div class="background">

<div class="overlay"></div>

<div class="floating floating1"></div>
<div class="floating floating2"></div>
<div class="floating floating3"></div>

</div>

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-5 col-md-7 col-sm-10">

<div class="login-card">

<div class="text-center">

<div class="ganesha-login-wrapper">


<img src="/static/images/ganesha.png"
class="ganesha-login"
id="ganeshaEye">


<div class="divine-glow"></div>


</div>

<h1 class="app-title">

MandalFlow

</h1>

<h5 class="committee-name">

KN STREET CHA RAJA

</h5>

<p class="devotion">

12 Years of Devotion

</p>

<div class="divider"></div>

</div>
<!-- ================= LOGIN FORM ================= -->

<form action="/login" method="POST" onsubmit="return showLoading()">

    <div class="mb-4">

        <label class="form-label fw-semibold">

            Username

        </label>

        <div class="input-group custom-input">

            <span class="input-group-text">

                <i class="fa-solid fa-user"></i>

            </span>

            <input
                type="text"
                class="form-control"
                name="username"
                placeholder="Enter Username"
                required>

        </div>

    </div>

    <div class="mb-4">

        <label class="form-label fw-semibold">

            Password

        </label>

        <div class="input-group custom-input">

            <span class="input-group-text">

                <i class="fa-solid fa-lock"></i>

            </span>

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter Password"
                required>

            <button
                class="btn btn-light"
                type="button"
                id="togglePassword">

                <i class="fa-solid fa-eye"></i>

            </button>

        </div>

    </div>

    {% if error %}

    <div class="alert alert-danger text-center">

        <i class="fa-solid fa-circle-exclamation"></i>

        {{ error }}

    </div>

    {% endif %}

    <button
        type="submit"
        class="btn login-btn w-100">

        <i class="fa-solid fa-right-to-bracket"></i>

        Login

    </button>

</form>

<div class="text-center mt-4">

    <small class="footer-text">

        Faith • Unity • Transparency

    </small>

    <br>

    <small class="footer-text">

        🌺 गणपति बाप्पा मोरया 🌺

    </small>

</div>
<!-- ================= FOOTER ================= -->

<div class="text-center mt-4">

    <div class="divider mb-3"></div>

    <p class="copyright">

        © 2026 MandalFlow

    </p>

    <p class="powered">

        Built with ❤️ for

        <strong>

            KN STREET CHA RAJA

        </strong>

    </p>

</div>

</div>

</div>

</div>

</div>

<script>

const togglePassword = document.getElementById("togglePassword");

const password = document.getElementById("password");

togglePassword.addEventListener("click", function(){

if(password.type === "password"){

password.type = "text";

this.innerHTML='<i class="fa-solid fa-eye-slash"></i>';

}else{

password.type = "password";

this.innerHTML='<i class="fa-solid fa-eye"></i>';

}

});

document.body.classList.add("loaded");
// GANESH EYE GAZING EFFECT

const ganesh = document.getElementById("ganeshaEye");


document.addEventListener("mousemove",(e)=>{


let x = (e.clientX / window.innerWidth - 0.5) * 15;

let y = (e.clientY / window.innerHeight - 0.5) * 15;


if(ganesh){

ganesh.style.transform =
`translate(${x}px, ${y}px)`;

}

});



// LOGIN LOADING ANIMATION

function showLoading(){


document.getElementById("loading-screen").style.display="flex";


setTimeout(function(){


document.querySelector("form").submit();


},3000);



return false;


}


</script>



<div id="loading-screen">


<div class="loading-content">


<img src="/static/images/ganesha.png"
class="loading-ganesha">


<h2>
🙏 गणपति बाप्पा मोरया 🙏
</h2>


<p>
Entering KN STREET CHA RAJA Dashboard
</p>


<div class="loader"></div>


</div>


</div>


</body>

</html>

</body>

</html>
