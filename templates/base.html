<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}KN STREET CHA RAJA{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

:root{

--primary:#ff7b00;
--secondary:#ffb347;
--success:#16a34a;
--danger:#dc2626;
--warning:#f59e0b;
--info:#2563eb;

--bg:#fff8ef;
--card:#ffffff;
--text:#2d3748;

--radius:22px;

--shadow:0 10px 30px rgba(0,0,0,.08);

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:'Poppins',sans-serif;

background:linear-gradient(
180deg,
#fff8ef,
#fffdf8
);

color:var(--text);

min-height:100vh;

}

a{

text-decoration:none;

}

.container-main{

padding-top:30px;
padding-bottom:120px;

}

/* NAVBAR */

.navbar{

background:linear-gradient(
135deg,
#ff7b00,
#ff9900
);

box-shadow:0 5px 18px rgba(0,0,0,.15);

}

.navbar-brand{

font-size:24px;

font-weight:700;

color:white!important;

}

.nav-link{

color:white!important;

font-weight:500;

}

/* HERO */

.hero{

background:linear-gradient(
135deg,
#ff7b00,
#ffb347
);

border-radius:30px;

padding:40px;

text-align:center;

color:white;

box-shadow:var(--shadow);

margin-bottom:25px;

}

.hero h1{

font-size:38px;

font-weight:700;

margin-top:10px;

}

.hero h4{

font-weight:500;

margin-top:8px;

}

.hero p{

margin-top:15px;

font-size:18px;

}

/* CARD */

.card-box{

background:white;

border-radius:22px;

padding:24px;

margin-bottom:22px;

box-shadow:var(--shadow);

transition:.3s;

}

.card-box:hover{

transform:translateY(-4px);

}

.section-title{

font-weight:700;

margin-bottom:18px;

}

/* STAT CARD */

.stat-card{

padding:25px;

border-radius:22px;

color:white;

text-align:center;

box-shadow:var(--shadow);

transition:.3s;

}

.stat-card:hover{

transform:translateY(-5px);

}

.stat-icon{

font-size:42px;

margin-bottom:12px;

}

.stat-number{

font-size:32px;

font-weight:700;

}

.bg-collection{

background:linear-gradient(135deg,#16a34a,#22c55e);

}

.bg-expense{

background:linear-gradient(135deg,#dc2626,#ef4444);

}

.bg-balance{

background:linear-gradient(135deg,#2563eb,#3b82f6);

}

.bg-pending{

background:linear-gradient(135deg,#f59e0b,#fbbf24);

}
/* ================= BUTTONS ================= */

.quick-btn{

border:none;

border-radius:18px;

padding:18px;

font-size:17px;

font-weight:600;

transition:.3s;

}

.quick-btn:hover{

transform:scale(1.04);

}

/* ================= PROGRESS ================= */

.progress{

height:18px;

border-radius:20px;

overflow:hidden;

background:#ececec;

}

.progress-bar{

border-radius:20px;

}

/* ================= FOOTER ================= */

.footer{

margin-top:40px;

padding:35px 20px;

text-align:center;

color:#666;

font-weight:600;

}

.footer h4{

color:var(--primary);

font-weight:700;

margin-bottom:10px;

}

/* ================= FLOATING BUTTON ================= */

.fab{

position:fixed;

right:20px;

bottom:90px;

width:60px;

height:60px;

border-radius:50%;

background:linear-gradient(135deg,#ff7b00,#ff9900);

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

color:white;

box-shadow:0 10px 25px rgba(0,0,0,.25);

z-index:999;

transition:.3s;

}

.fab:hover{

transform:scale(1.08);

color:white;

}

/* ================= MOBILE NAV ================= */

.mobile-nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:70px;

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -5px 20px rgba(0,0,0,.12);

z-index:998;

}

.mobile-nav a{

display:flex;

flex-direction:column;

align-items:center;

text-decoration:none;

color:#555;

font-size:22px;

font-weight:600;

}

.mobile-nav span{

font-size:11px;

margin-top:3px;

}

.mobile-nav a:hover{

color:var(--primary);

}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

.hero{

padding:25px;

border-radius:22px;

}

.hero h1{

font-size:28px;

}

.hero h4{

font-size:20px;

}

.hero p{

font-size:15px;

}

.container-main{

padding:15px;

padding-bottom:120px;

}

.card-box{

padding:18px;

}

.quick-btn{

font-size:15px;

padding:14px;

}

.navbar-brand{

font-size:20px;

}

.fab{

bottom:90px;

width:55px;

height:55px;

font-size:24px;

}

}

@media(min-width:769px){

.mobile-nav{

display:none;

}

}

</style>

</head>

<body>

{% include "navbar.html" %}

<div class="container container-main">

{% block content %}

{% endblock %}

</div>

<div class="footer">

<h4>

🌺 गणपति बाप्पा मोरया 🌺

</h4>

<p>

🙏 मंगलमूर्ति मोरया 🙏

</p>

<small>

KN STREET CHA RAJA Digital Chanda Management

</small>

</div>

<a href="/add-member" class="fab">

<i class="fa-solid fa-plus"></i>

</a>

<div class="mobile-nav">

<a href="/dashboard">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a href="/members">

<i class="fa-solid fa-users"></i>

<span>Members</span>

</a>

<a href="/payments">

<i class="fa-solid fa-indian-rupee-sign"></i>

<span>Collect</span>

</a>

<a href="/expenses">

<i class="fa-solid fa-wallet"></i>

<span>Expense</span>

</a>

<a href="/logout">

<i class="fa-solid fa-right-from-bracket"></i>

<span>Logout</span>

</a>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}

{% endblock %}
</body>

</html>
